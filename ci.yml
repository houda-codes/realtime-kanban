name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check backend imports cleanly
        run: python -c "import main"

      - name: Build backend Docker image
        run: docker build -f backend.Dockerfile -t kanban-backend .

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./kanban-frontend
        run: npm install

      - name: Build frontend
        working-directory: ./kanban-frontend
        run: npm run build

      - name: Build frontend Docker image
        run: docker build -f frontend.Dockerfile -t kanban-frontend .
